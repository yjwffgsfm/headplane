name: Build Headplane Docker Image

# 触发条件：推送 v 开头的标签时触发
on:
  push:
    tags:
      - 'v*'  # 匹配 v1.0.0, v2.1.3 等

env:
  REGISTRY: ghcr.io
  # 镜像全名：ghcr.io/yjwffgsfm/headplane
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write  # 推送到 GHCR 需要此权限

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 设置多架构构建（可选，但推荐支持 arm64）
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 登录到 GitHub Container Registry
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 从标签提取版本号并生成镜像标签
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # 从 v1.2.3 提取出 1.2.3 作为版本标签
            type=semver,pattern={{version}}
            # 同时打上 latest 标签（正式版才打）
            type=semver,pattern=latest,enable=${{ !contains(github.ref_name, '-') }}
            # 保留原始标签名如 v1.2.3 作为额外标签（可选）
            type=raw,value=${{ github.ref_name }}

      # 构建并推送镜像
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # 支持的架构：amd64 和 arm64
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
